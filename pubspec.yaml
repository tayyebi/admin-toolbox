name: admin_toolbox
description: Mobile-first Infrastructure Operations Platform for Linux server administration.
publish_to: 'none'
version: 1.0.0

environment:
  sdk: ^3.2.0

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5
  sqflite: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.3
  dio: ^5.4.3+1
  fl_chart: ^0.68.0
  connectivity_plus: ^6.0.3
  go_router: ^14.2.0
  uuid: ^4.4.0
  intl: ^0.19.0
  shared_preferences: ^2.2.3
  flutter_animate: ^4.5.0
  google_fonts: ^6.2.1
  wakelock_plus: ^1.2.8
  share_plus: ^9.0.0
  encrypt: ^5.0.3
  pointycastle: ^3.9.1
  dartssh2: ^2.10.0
  ssh_key: ^0.8.0
  crypto: ^3.0.3
  local_auth: ^2.2.0
  flutter_secure_storage: ^9.2.2
  json_annotation: ^4.9.0
  freezed_annotation: ^2.4.1
  logger: ^2.3.0
  flex_color_scheme: ^7.3.1
  smooth_page_indicator: ^1.1.0
  shimmer: ^3.0.0
  pull_to_refresh: ^2.0.0
  file_picker: ^8.0.3
  url_launcher: ^6.2.6
  package_info_plus: ^8.0.0
  device_info_plus: ^10.1.0
  permission_handler: ^11.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  build_runner: ^2.4.9
  json_serializable: ^6.8.0
  freezed: ^2.5.2
  riverpod_generator: ^2.4.0

flutter:
  uses-material-design: true
  fonts:
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/JetBrainsMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/JetBrainsMono-Bold.ttf
          weight: 700
