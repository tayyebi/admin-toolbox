name: Build

on:
  push:
    branches: ['main']
    tags: ['v*']
  pull_request:
    branches: ['main']
  workflow_dispatch:

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.27.4'

jobs:
  verify:
    name: Analyse and test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - run: flutter pub get

      - name: Check formatting
        run: dart format --set-exit-if-changed --line-length 100 lib test

      - name: Analyze
        run: flutter analyze --fatal-infos

      - name: Run tests
        run: flutter test --coverage

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage
          path: coverage/lcov.info
          if-no-files-found: ignore

  build:
    name: Build Android
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - run: flutter pub get

      - name: Derive version
        id: version
        run: |
          # Monotonic build number from commit count; version name from the tag
          # when there is one, otherwise from pubspec.
          echo "code=$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "name=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "name=$(grep '^version:' pubspec.yaml | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up release signing
        env:
          STORE_FILE_B64: ${{ secrets.STORE_FILE_B64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -n "$STORE_FILE_B64" ]; then
            echo "$STORE_FILE_B64" | base64 -d > release.keystore
            {
              echo "storePassword=$STORE_PASSWORD"
              echo "keyPassword=$KEY_PASSWORD"
              echo "keyAlias=$KEY_ALIAS"
              echo "storeFile=../../release.keystore"
            } > android/key.properties
          else
            # No signing secrets configured: generate a throwaway key so the
            # release build still compiles. The resulting artifact is NOT
            # distributable — it cannot be updated by a properly signed build.
            echo "::warning::No signing secrets found; building with a throwaway key"
            keytool -genkey -v -keystore release.keystore \
              -alias release -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass android -keypass android \
              -dname "CN=AdminToolbox, OU=Dev, O=AdminToolbox, L=City, ST=State, C=US"
            {
              echo "storePassword=android"
              echo "keyPassword=android"
              echo "keyAlias=release"
              echo "storeFile=../../release.keystore"
            } > android/key.properties
          fi

      - name: Build release APK
        run: |
          flutter build apk --release \
            --build-number=${{ steps.version.outputs.code }} \
            --build-name=${{ steps.version.outputs.name }} \
            --split-debug-info=build/symbols \
            --obfuscate

      - name: Build App Bundle
        run: |
          flutter build appbundle --release \
            --build-number=${{ steps.version.outputs.code }} \
            --build-name=${{ steps.version.outputs.name }} \
            --split-debug-info=build/symbols \
            --obfuscate

      - uses: actions/upload-artifact@v4
        with:
          name: admin-toolbox-release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      - uses: actions/upload-artifact@v4
        with:
          name: admin-toolbox-release-aab
          path: build/app/outputs/bundle/release/app-release.aab

      # Obfuscated stack traces are unreadable without these. Keep them for
      # every release or crash reports from the field cannot be symbolicated.
      - uses: actions/upload-artifact@v4
        with:
          name: debug-symbols
          path: build/symbols
          if-no-files-found: warn

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          files: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
          generate_release_notes: true
          make_latest: true
