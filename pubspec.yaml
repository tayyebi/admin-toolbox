name: admin_toolbox
description: Mobile-first Infrastructure Operations Platform for Linux server administration.
publish_to: 'none'
version: 1.3.0

environment:
  sdk: ^3.2.0

dependencies:
  flutter:
    sdk: flutter

  # State & navigation
  flutter_riverpod: ^2.5.1
  go_router: ^14.2.0

  # Storage
  sqflite: ^2.3.3
  path: ^1.9.0
  path_provider: ^2.1.3
  shared_preferences: ^2.2.3
  flutter_secure_storage: ^9.2.2

  # Crypto & auth
  encrypt: ^5.0.3
  pointycastle: ^3.9.1
  crypto: ^3.0.3
  local_auth: ^2.2.0

  # Remote access
  dartssh2: ^2.10.0
  xterm: ^4.0.0

  # UI
  fl_chart: ^0.68.0
  flutter_animate: ^4.5.0

  # Platform integration
  file_picker: ^8.0.3
  share_plus: ^9.0.0
  url_launcher: ^6.2.6
  package_info_plus: ^8.0.0
  device_info_plus: ^10.1.0
  wakelock_plus: ^1.2.8
  flutter_local_notifications: ^17.2.1
  permission_handler: ^11.3.1

  # Utilities
  uuid: ^4.4.0
  intl: ^0.19.0
  logger: ^2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  sqflite_common_ffi: ^2.3.3

flutter:
  uses-material-design: true
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-Regular.ttf
          weight: 400
        - asset: assets/fonts/Inter-Medium.ttf
          weight: 500
        - asset: assets/fonts/Inter-SemiBold.ttf
          weight: 600
    - family: JetBrainsMono
      fonts:
        - asset: assets/fonts/JetBrainsMono-Regular.ttf
          weight: 400
        - asset: assets/fonts/JetBrainsMono-Medium.ttf
          weight: 500
        - asset: assets/fonts/JetBrainsMono-Bold.ttf
          weight: 700
