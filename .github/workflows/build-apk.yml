name: CI

# Analysis and tests run on every push and pull request. Artifacts are only
# built for a release tag, or on demand — building an APK and an App Bundle on
# every commit costs several minutes per run and produces artifacts nobody
# installs.
on:
  push:
    branches: ['main']
    tags: ['v*']
  pull_request:
    branches: ['main']
  workflow_dispatch:
    inputs:
      build_artifacts:
        description: 'Build the APK and App Bundle'
        type: boolean
        default: true

permissions:
  contents: read

env:
  FLUTTER_VERSION: '3.27.4'

jobs:
  verify:
    name: Analyse and test
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - run: flutter pub get

      # Reported but not blocking: the tree has not had a formatting pass yet.
      # Run `dart format --line-length 100 lib test`, commit the result, then
      # drop the continue-on-error to make this a gate.
      - name: Check formatting
        continue-on-error: true
        run: dart format --output=none --set-exit-if-changed --line-length 100 lib test

      # Errors and warnings block; infos are advisory. The analysis_options
      # promotes the correctness lints that matter to warning level.
      - name: Analyze
        run: flutter analyze --fatal-warnings

      - name: Run tests
        run: flutter test

  build:
    name: Build Android
    needs: verify
    # Release tags, or a manual run that asks for it. Ordinary pushes to main
    # and pull requests stop after verify.
    if: >-
      startsWith(github.ref, 'refs/tags/v') ||
      (github.event_name == 'workflow_dispatch' && inputs.build_artifacts)
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - run: flutter pub get

      - name: Derive version
        id: version
        run: |
          # Monotonic build number from commit count; version name from the tag
          # when there is one, otherwise from pubspec.
          echo "code=$(git rev-list --count HEAD)" >> "$GITHUB_OUTPUT"
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            echo "name=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"
          else
            echo "name=$(grep '^version:' pubspec.yaml | cut -d' ' -f2)" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up release signing
        env:
          STORE_FILE_B64: ${{ secrets.STORE_FILE_B64 }}
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
        run: |
          if [ -n "$STORE_FILE_B64" ]; then
            echo "$STORE_FILE_B64" | base64 -d > release.keystore
            {
              echo "storePassword=$STORE_PASSWORD"
              echo "keyPassword=$KEY_PASSWORD"
              echo "keyAlias=$KEY_ALIAS"
              echo "storeFile=../../release.keystore"
            } > android/key.properties
          else
            # No signing secrets configured: generate a throwaway key so the
            # release build still compiles. The resulting artifact is NOT
            # distributable — it cannot be updated by a properly signed build.
            echo "::warning::No signing secrets found; building with a throwaway key"
            keytool -genkey -v -keystore release.keystore \
              -alias release -keyalg RSA -keysize 2048 -validity 10000 \
              -storepass android -keypass android \
              -dname "CN=AdminToolbox, OU=Dev, O=AdminToolbox, L=City, ST=State, C=US"
            {
              echo "storePassword=android"
              echo "keyPassword=android"
              echo "keyAlias=release"
              echo "storeFile=../../release.keystore"
            } > android/key.properties
          fi

      # Dart obfuscation is deliberately off. It only pays for itself alongside
      # the --split-debug-info symbol archive, and without that archive an
      # obfuscated release produces stack traces nobody can read. R8 still
      # shrinks and minifies the Android side.
      - name: Build release APK
        run: |
          flutter build apk --release \
            --build-number=${{ steps.version.outputs.code }} \
            --build-name=${{ steps.version.outputs.name }}

      - name: Name the APK after its version
        id: apk
        run: |
          SRC=build/app/outputs/flutter-apk/app-release.apk
          OUT="admin-toolbox-${{ steps.version.outputs.name }}.apk"
          mv "$SRC" "$OUT"
          echo "path=$OUT" >> "$GITHUB_OUTPUT"
          echo "Built $OUT ($(du -h "$OUT" | cut -f1))"

      # GitHub always zips workflow artifacts — that is the platform, not a
      # setting. The release asset below is the plain, installable .apk.
      - uses: actions/upload-artifact@v4
        with:
          name: admin-toolbox-apk
          path: ${{ steps.apk.outputs.path }}
          compression-level: 0
          if-no-files-found: error

      - name: Create release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          files: ${{ steps.apk.outputs.path }}
          generate_release_notes: true
          make_latest: true
