plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

def keystoreProperties = new Properties()
def keystorePropertiesFile = rootProject.file("key.properties")
if (keystorePropertiesFile.exists()) {
    keystoreProperties.load(new FileInputStream(keystorePropertiesFile))
}

// CI overrides these so every build is uniquely versioned.
def flutterVersionCode = project.hasProperty('versionCode')
        ? project.property('versionCode').toInteger()
        : 1
def flutterVersionName = project.hasProperty('versionName')
        ? project.property('versionName')
        : "1.0.0"

android {
    namespace = "com.admin.toolbox"
    compileSdk = 35
    ndkVersion = flutter.ndkVersion

    compileOptions {
        // AGP 8 deprecates Java 8; 17 matches the toolchain Flutter 3.27 ships with.
        sourceCompatibility = JavaVersion.VERSION_17
        targetCompatibility = JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }

    defaultConfig {
        applicationId = "com.admin.toolbox"
        // flutter_secure_storage and local_auth both require 23.
        minSdk = 23
        targetSdk = 35
        versionCode = flutterVersionCode
        versionName = flutterVersionName
    }

    signingConfigs {
        release {
            keyAlias = keystoreProperties["keyAlias"]
            keyPassword = keystoreProperties["keyPassword"]
            storeFile = keystoreProperties["storeFile"] ? file(keystoreProperties["storeFile"]) : null
            storePassword = keystoreProperties["storePassword"]
        }
    }

    buildTypes {
        debug {
            // Lets a debug build sit alongside a release install on one device.
            applicationIdSuffix = ".debug"
            versionNameSuffix = "-debug"
        }
        release {
            signingConfig = signingConfigs.release
            minifyEnabled = true
            shrinkResources = true
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    packagingOptions {
        resources {
            excludes += ["META-INF/*.kotlin_module", "META-INF/DEPENDENCIES"]
        }
    }
}

flutter {
    source = "../.."
}
